services:
  # Backend Realtime Node.js + Socket.IO Service
  - type: web
    name: cricket-auction-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false
